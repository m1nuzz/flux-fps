# Release workflow: a vX.Y.Z tag builds the signed-to-be resident MSI plus
# the two portable tools. Exactly three assets are published (AGENTS.md).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release binaries
        run: cargo build --release --locked --workspace

      - name: Validate installer infrastructure
        shell: pwsh
        run: ./scripts/validate-infrastructure.ps1

      # Hard invariant: publish only a resident binary that passed the PE
      # import-table audit (no driver loading, game memory access or injection).
      - name: Audit resident import table
        shell: pwsh
        run: ./scripts/audit-import-table.ps1 -BinaryPath target/release/flux-fps.exe

      - name: Install WiX v4 CLI
        run: dotnet tool install --tool-path ./wix-tool wix --version 4.0.6

      - name: Build MSI and package portable tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          # MSI ProductVersion must be numeric (x.y.z[.w]); strip a prerelease
          # suffix such as -beta.1 from the tag before passing it to WiX.
          $msiVersion = ($version -split '-')[0]
          if ($msiVersion -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Invalid MSI version derived from tag: $msiVersion"
          }
          New-Item -ItemType Directory -Force dist | Out-Null

          ./wix-tool/wix.exe build ./installer/Product.wxs -arch x64 `
            -d ProductVersion=$msiVersion `
            -d ResidentExe=target/release/flux-fps.exe `
            -o ./dist/flux-fps.msi
          if (-not (Test-Path ./dist/flux-fps.msi)) { throw 'WiX did not produce an MSI' }

          Compress-Archive -Path target/release/flux-fps-setup.exe -DestinationPath dist/flux-fps-setup.zip
          Compress-Archive -Path target/release/flux-fps-master.exe -DestinationPath dist/flux-fps-master.zip

          # winget manifests describe a stable package only; refresh them for
          # stable tags and expose the MSI hash in the release notes.
          # Signing is not configured yet (docs/SIGNING.md).
          if ($env:GITHUB_REF_NAME -notmatch '-') {
            ./scripts/Update-WingetManifest.ps1 -MsiPath ./dist/flux-fps.msi -Version $msiVersion
          }
          $hash = (Get-FileHash ./dist/flux-fps.msi -Algorithm SHA256).Hash.ToLowerInvariant()
          "MSI_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Get-ChildItem dist | Select-Object Name, Length

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $prereleaseNote = ''
          if ($tag -match '-') {
            $prereleaseNote = 'This is a prerelease. Do not treat it as a stable v0.1.0 promotion.'
          }
          $notes = @"
          flux-fps $tag

          $prereleaseNote

          Assets:
          - flux-fps.msi - resident tray/Core Engine installer (WiX v4, registers the logon tasks)
          - flux-fps-setup.zip - portable baseline wizard
          - flux-fps-master.zip - portable calibration and A/B validation suite

          MSI SHA256: $env:MSI_SHA256

          What changed: see docs/RELEASE_NOTES.md in the repository.

          Tested: GitHub Actions format, check, clippy (-D warnings), unit tests,
          locked workspace build, installer script/XML/manifest validation,
          resident PE import-table audit and a WiX v4 MSI authoring build.

          Known limitations: builds are unsigned until SignPath is configured
          (SmartScreen will warn; verify the hash above first). No real
          Deadlock/CS2 A/B runs, 24 h soak, anti-cheat-system launch test or
          MSI install/uninstall smoke test have been performed by the
          maintainers. No kernel driver is bundled; kernel access is refused.

          Owner should verify: install/uninstall and both logon tasks, the
          baseline wizard, calibration profile in the settings panel, the
          ABAB workflow, the 24 h soak and restore-test. See docs/VALIDATION.md
          and docs/ANTI_CHEAT_CHECKLIST.md.
          "@
          $ghArgs = @('release', 'create', $tag, '--title', "flux-fps $tag", '--notes', $notes)
          if ($tag -match '-') { $ghArgs += '--prerelease' }
          $ghArgs += @('dist/flux-fps.msi', 'dist/flux-fps-setup.zip', 'dist/flux-fps-master.zip')
          & gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with $LASTEXITCODE" }
