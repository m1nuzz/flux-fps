name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build binaries for packaging checks
        run: cargo build --workspace --locked
      # Phase 6 UI gate: the resident app must open a visible window, not
      # just run its engine threads. The minimal reactor example bisects
      # environment failures from defects in the resident app itself.
      - name: Build minimal UI smoke example
        run: cargo build -p flux-fps --locked --example smoke_window
      - name: Smoke test the minimal reactor window
        shell: pwsh
        run: ./scripts/smoke-ui.ps1 -BinaryPath target/debug/examples/smoke_window.exe -TimeoutSeconds 30
      - name: Smoke test the tray UI window
        shell: pwsh
        run: ./scripts/smoke-ui.ps1 -BinaryPath target/debug/flux-fps.exe
      - name: Validate installer infrastructure
        shell: pwsh
        run: ./scripts/validate-infrastructure.ps1
      # Hard invariant: the resident binary must not import driver-loading,
      # game memory access or injection APIs (AGENTS.md).
      - name: Audit resident import table
        shell: pwsh
        run: ./scripts/audit-import-table.ps1 -BinaryPath target/debug/flux-fps.exe
      - name: Install WiX v4 CLI
        run: dotnet tool install --tool-path ./wix-tool wix --version 4.0.6
      # Build the MSI on every push so authoring errors surface in CI rather
      # than at release time. The debug binary is used as the file source.
      - name: Build MSI (authoring validation)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          ./wix-tool/wix.exe build ./installer/Product.wxs -arch x64 `
            -d ProductVersion=0.1.0 `
            -d ResidentExe=target/debug/flux-fps.exe `
            -o ./dist/flux-fps.msi
          if (-not (Test-Path ./dist/flux-fps.msi)) { throw 'WiX did not produce an MSI' }
          Get-Item ./dist/flux-fps.msi | Select-Object Name, Length
