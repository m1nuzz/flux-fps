License: MIT
ShortDescription: User-mode Windows 11 game optimizer
Description: |-
  flux-fps tunes the operating system so games run in a clean environment:
  CPU Set isolation for background processes, low-priority standby list
  purges, latency telemetry and an advisory FPS cap. The resident application
  is user-mode only: no driver loading, no game memory access, no DLL
  injection. An elevated helper process is started through Task Scheduler.
